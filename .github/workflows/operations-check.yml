name: Operations feature checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/media-icons/**'
      - 'lib/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/operations-check.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/media-icons/**'
      - 'lib/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - '.github/workflows/operations-check.yml'

jobs:
  operations:
    runs-on: ubuntu-latest
    # Match the runner package below; browsers and OS dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify URLs and placement validation
        run: |
          node scripts/verify-auth-callback.cjs
          node scripts/verify-top-navigation.cjs
          node scripts/verify-workspace-months.cjs
          node scripts/verify-creative-image.cjs
          node scripts/verify-creative-image-render.cjs
          node scripts/verify-daily-multi-metrics.cjs
          node scripts/verify-creative-rotation.cjs
          node scripts/verify-creative-calendar.cjs
          node scripts/verify-creative-rotation-render.cjs
          node scripts/verify-creative-link-input.mjs
          node scripts/verify-creative-material.cjs
          node scripts/verify-monitoring-plan-scope.cjs
          node scripts/verify-performance-report.cjs
          node scripts/verify-performance-brief.cjs
          node scripts/verify-performance-report-render.cjs
          node scripts/verify-performance-source-render.cjs
          node scripts/verify-viral-placement-board.cjs
          node scripts/verify-media-icons.cjs
          node scripts/verify-media-label.cjs
          node scripts/verify-showroom-breakdown.cjs
          node scripts/verify-placement-showroom.cjs
          node scripts/verify-proof-lightbox.cjs
          node scripts/verify-placement-input.mjs
          node scripts/verify-placement-edge.mjs
          node scripts/verify-report-sources.cjs
          node scripts/verify-tv-preview.cjs
          node scripts/verify-media-mix.cjs
          node scripts/verify-media-mix-auto.cjs
          node scripts/verify-media-mix-source.cjs
          node scripts/verify-performance-visuals.cjs
      - run: npm run build
      - name: Install matching browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify preinstalled Chromium runtime
        run: node -e 'require("playwright").chromium.launch().then(async browser => { console.log("Chromium runtime ready"); await browser.close(); }).catch(error => { console.error(error); process.exit(1); })'
      - name: Verify operations UI
        run: |
          npm run start > /tmp/media-report-server.log 2>&1 &
          node -e 'const http=require("http"); let tries=0; function probe(){ http.get("http://127.0.0.1:3000",r=>process.exit(0)).on("error",()=>{if(++tries>60)process.exit(1);setTimeout(probe,1000)})} probe()'
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-creative-rotation-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-creative-material-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-performance-report-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-placement-showroom-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-tv-preview-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-proof-image-input-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-proof-lightbox-ui.mjs
          node scripts/verify-operations-ui.mjs
          node scripts/verify-report-sources-ui.mjs
          node scripts/verify-layout-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-media-mix-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-media-mix-auto-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-media-mix-source-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-performance-visuals-ui.mjs
          REPORTING_TEST_URL=http://127.0.0.1:3000 node scripts/verify-report-upgrade-ui.mjs
